receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  # Human-inspectable trace stream for Jaeger UI only.
  # No file exporter — spans.jsonl growth contaminates latency measurements
  # via VirtioFS on Docker Desktop. Use collector.yaml for E3 span dumps.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
