_format_version: "3.0"
_transform: true

# `key` MUST equal the `iss` claim Keycloak stamps into the token, which is
# fixed by KC_HOSTNAME in docker-compose.bench.yml. If you change that, change
# this too or every request returns 401.
consumers:
  - username: mcp-agent

jwt_secrets:
  - consumer: mcp-agent
    key: "http://keycloak:8080/realms/mcp"
    algorithm: RS256
    rsa_public_key: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuKpq3V8AEsOkVvm/LfPf
        vagv8l9PzDU3OR8aefUCdqN5DAAye+w2aExcVoGG8cNkT55XmO7AcQ86Kd34D+Jo
        HEkPWmhW47wORMpMe/+CYag4hilo66jksQn8xGQQIXNRtty2XFTaIVZU0vYOLiM2
        29HzKz4NGsm9xjqFRl0BmzfJu6NdbxHCJbjumrJAQE77zp4aNYr8d1spTDXNdYFJ
        JXJ95LF7Vjr0/DdNSEr70tITidQwk+jo+2X0gncw7cecFm93spM0yAlu5PnSySDh
        wHEJ62bIIRVy+zoFNGuuEpd2lwbSaVOgmHbGUoeP69PLafx1A78p37VFMLdAGOub
        YwIDAQAB
        -----END PUBLIC KEY-----

services:
  # Governed path: JWT + rate-limiting + OpenTelemetry. The E1 "gateway" arm.
  - name: bridge-governed
    url: http://bridge:8080
    routes:
      - name: bridge-governed-route
        paths:
          - /db
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          # Far above the benchmark rate on purpose. We are measuring the cost
          # of the plugin executing, not the cost of being throttled.
          minute: 1000000
          policy: local
      - name: opentelemetry
        config:
          traces_endpoint: http://otel-collector:4318/v1/traces
          resource_attributes:
            service.name: kong-bench

  # Passthrough path: same Kong process, same upstream, ZERO plugins.
  # bridge-passthrough must never gain a plugin — its entire purpose is to be
  # the plugin-free control so (passthrough − direct) isolates proxy hop cost
  # and (gateway − passthrough) isolates governance policy cost.
  - name: bridge-passthrough
    url: http://bridge:8080
    routes:
      - name: bridge-passthrough-route
        paths:
          - /raw
        strip_path: true
    # No plugins. Deliberately.

  # MCP governed path: client → Kong /mcp → FastMCP mcp-server:8080/mcp → bridge.
  # strip_path: false so upstream keeps /mcp (FastMCP streamable HTTP endpoint).
  # Same jwt + rate-limiting + opentelemetry chain as /db (REST governed).
  # mcp-direct bypasses Kong (host port 9090); this route is mcp-governed only.
  # No APISIX MCP route — Kong already has the full policy chain for a clean
  # REST-vs-MCP policy-cost comparison on one gateway.
  - name: mcp-server-governed
    url: http://mcp-server:8080
    routes:
      - name: mcp-governed-route
        paths:
          - /mcp
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          minute: 1000000
          policy: local
      - name: opentelemetry
        config:
          traces_endpoint: http://otel-collector:4318/v1/traces
          resource_attributes:
            service.name: kong-bench
