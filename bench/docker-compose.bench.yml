# GatewayDB-MCP evaluation harness.
#
# Adds a real gateway policy chain (Kong OSS + Keycloak + OpenTelemetry) and the
# extra database instances needed for the reproducibility and cross-database
# experiments. Everything here is Apache 2.0 or equivalent: no vendor account,
# no cloud subscription, no enterprise licence, no benchmark-publication
# restriction.
#
#   docker compose -f docker-compose.bench.yml up -d                  # latency stack (default)
#   docker compose -f docker-compose.bench.yml --profile extra up -d  # + E3/E4 services
#   docker compose -f docker-compose.bench.yml --profile bench run --rm k6 run /scripts/latency.js
#
# Default services = E1 latency set. Profile `extra` = mysql-b, bridge-b, postgres,
# bridge-pg, mariadb, bridge-mariadb (E3/E4 only). Do not run E1 while `extra` is up —
# those containers contend for the same Docker VM CPUs and confound the gateway-cost delta.
#
# Run from the bench/ directory. Build context is the repository root.

name: gatewaydb-mcp-bench

x-bridge-env: &bridge-env
  SECURITY_READ_ONLY: "true"
  SECURITY_ALLOWED_TABLES: orders,products,customers
  SECURITY_MAX_ROWS: "500"
  SECURITY_QUERY_TIMEOUT: "30"
  API_TITLE: "Test DB MCP Bridge"

x-bridge-build: &bridge-build
  context: ..
  dockerfile: sidecar/Dockerfile

x-bridge-build-mariadb: &bridge-build-mariadb
  context: ..
  dockerfile: sidecar/Dockerfile
  args:
    MAVEN_PROFILES: mariadb

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Databases
  # ─────────────────────────────────────────────────────────────────────────

  # MYSQL_USER is intentionally omitted. The official entrypoint GRANTs ALL to
  # MYSQL_USER after (or around) init scripts, which defeated SELECT-only. Create
  # readonly_user inside init-*.sql instead — same pattern as postgres below.
  mysql-a:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
    volumes:
      - ./db/init-mysql-a.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Must use TCP — `localhost` hits the Unix socket, which the entrypoint's
      # temporary init server answers while 3306 is still closed.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -u root -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Identical schema, different rows. Exists solely for E3. Profile-gated so
  # latency runs do not pay for a second MySQL + JVM on the same Docker VM.
  mysql-b:
    image: mysql:8.0
    profiles: ["extra"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
    volumes:
      - ./db/init-mysql-b.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -u root -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # MariaDB reuses MySQL schema.sql + data-a.sql. SELECT-only user is created in
  # init-mariadb-user.sql (same Layer 1 pattern as mysql-a / postgres).
  mariadb:
    image: mariadb:11.4
    profiles: ["extra"]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: testdb
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data-a.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./db/init-mariadb-user.sql:/docker-entrypoint-initdb.d/03-user.sql:ro
    healthcheck:
      # Prefer root TCP ping over healthcheck.sh: the image's healthcheck user is
      # not created when only MARIADB_ROOT_PASSWORD / MARIADB_DATABASE are set.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P 3306 --protocol=TCP -uroot -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # POSTGRES_USER is the superuser (postgres), not the app credential. readonly_user
  # is created SELECT-only in init-postgres.sql (mirrors MySQL Layer 1).
  postgres:
    image: postgres:16
    profiles: ["extra"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: testdb
    volumes:
      - ./db/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Force TCP; bare pg_isready uses the local socket and can race init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # Bridge instances (one per database)
  # ─────────────────────────────────────────────────────────────────────────

  bridge:
    build: *bridge-build
    environment:
      <<: *bridge-env
      DB_TYPE: mysql
      DB_HOST: mysql-a
      DB_PORT: "3306"
      DB_DATABASE: testdb
      DB_USERNAME: readonly_user
      DB_PASSWORD: readonlypassword
    ports:
      - "8080:8080"          # direct path, the E1 baseline
    depends_on:
      mysql-a: {condition: service_healthy}
    healthcheck:
      # curl -f fails on 503 while the pool is still retrying startup.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  bridge-b:
    build: *bridge-build
    profiles: ["extra"]
    environment:
      <<: *bridge-env
      DB_TYPE: mysql
      DB_HOST: mysql-b
      DB_PORT: "3306"
      DB_DATABASE: testdb
      DB_USERNAME: readonly_user
      DB_PASSWORD: readonlypassword
    ports:
      - "8082:8080"
    depends_on:
      mysql-b: {condition: service_healthy}

  bridge-pg:
    build: *bridge-build
    profiles: ["extra"]
    environment:
      <<: *bridge-env
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: testdb
      DB_USERNAME: readonly_user
      DB_PASSWORD: readonlypassword
    ports:
      - "8083:8080"
    depends_on:
      postgres: {condition: service_healthy}

  bridge-mariadb:
    build: *bridge-build-mariadb
    profiles: ["extra"]
    environment:
      <<: *bridge-env
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: testdb
      DB_USERNAME: readonly_user
      DB_PASSWORD: readonlypassword
    ports:
      - "8084:8080"
    depends_on:
      mariadb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────
  # Gateway policy chain
  # ─────────────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixes the `iss` claim. kong/kong.yml keys off this exact string.
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-mcp.json:/opt/keycloak/data/import/realm-mcp.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/mcp HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"          # gateway path, the E1 treatment
      - "8001:8001"
    depends_on:
      bridge: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────
  # Telemetry
  # ─────────────────────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      # OTEL_COLLECTOR_CONFIG selects collector.yaml (E3 file exporter) or
      # collector-jaeger-only.yaml (citable latency: no unbounded spans.jsonl).
      - ${OTEL_COLLECTOR_CONFIG:-./collector.yaml}:/etc/otel/collector.yaml:ro
      - ./results:/output
    depends_on:
      jaeger: {condition: service_started}

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Bound the in-memory store. Without this the store grows unbounded and
      # ingestion cost grows with it, making governed throughput a function of
      # run ordering. Maps to --memory.max-traces (Jaeger v1 / all-in-one 1.62.0;
      # viper AutomaticEnv: MEMORY_MAX_TRACES). See bench/README.md
      # "Telemetry confounds".
      MEMORY_MAX_TRACES: "10000"
    # Belt-and-suspenders: same flag as argv in case env binding is skipped.
    command: ["--memory.max-traces=10000"]
    ports:
      - "16686:16686"        # UI
    # Image has no shell/wget; preflight probes the UI HTTP API instead.

  # ─────────────────────────────────────────────────────────────────────────
  # Load generator (profile-gated so it does not start with the stack)
  # ─────────────────────────────────────────────────────────────────────────

  k6:
    image: grafana/k6:0.54.0
    profiles: ["bench"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      TARGET: ${TARGET:-direct}
      VUS: ${VUS:-10}
      ITERATIONS: ${ITERATIONS:-1000}
      DIRECT_URL: http://bridge:8080
      PASSTHROUGH_URL: http://kong:8000/raw
      GATEWAY_URL: http://kong:8000/db
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - kong
