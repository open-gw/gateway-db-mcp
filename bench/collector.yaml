receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  # Human-inspectable trace stream for Jaeger UI
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Machine-diffable span records. E3 (reproducibility) compares these
  # between the two bridge instances.
  file:
    path: /output/spans.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, file]
