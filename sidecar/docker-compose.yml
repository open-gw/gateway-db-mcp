version: "3.9"

services:

  # ── MySQL test database ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: readonly_user
      MYSQL_PASSWORD: readonlypassword
    ports:
      - "3306:3306"
    volumes:
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── gateway-db-mcp sidecar ─────────────────────────────────────────────────
  bridge:
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
    environment:
      DB_TYPE:                 mysql
      DB_HOST:                 mysql
      DB_PORT:                 "3306"
      DB_DATABASE:             testdb
      DB_USERNAME:             readonly_user
      DB_PASSWORD:             readonlypassword
      SECURITY_READ_ONLY:      "true"
      SECURITY_ALLOWED_TABLES: orders,products,customers
      SECURITY_MAX_ROWS:       "500"
      SECURITY_QUERY_TIMEOUT:  "30"
      API_TITLE:               "Test DB MCP Bridge"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
