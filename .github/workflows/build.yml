name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn compile --no-transfer-progress

      - name: Run unit tests
        run: mvn test --no-transfer-progress

      - name: Package shaded JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Verify shaded JAR (callout + Main-Class)
        run: |
          JAR=$(ls target/gateway-db-mcp-*.jar | head -n1)
          echo "Checking: $JAR"
          jar tf "$JAR" | grep -q "io/github/opengw/dbmcp/DBMCPCallout.class" \
            || { echo "JAR missing DBMCPCallout.class"; exit 1; }
          jar tf "$JAR" | grep -q "io/github/opengw/dbmcp/server/SidecarServer.class" \
            || { echo "JAR missing SidecarServer.class"; exit 1; }
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q "Main-Class: io.github.opengw.dbmcp.server.SidecarServer" \
            || { echo "MANIFEST missing Main-Class SidecarServer"; exit 1; }
          echo "OK: DBMCPCallout + SidecarServer Main-Class present"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: gateway-db-mcp-jar
          path: target/gateway-db-mcp-*.jar

  # Keep packaging on main for convenience.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Package shaded JAR
        run: mvn package -DskipTests --no-transfer-progress
      - name: Verify shaded JAR (callout + Main-Class)
        run: |
          JAR=$(ls target/gateway-db-mcp-*.jar | head -n1)
          jar tf "$JAR" | grep -q "io/github/opengw/dbmcp/DBMCPCallout.class" \
            || { echo "JAR missing DBMCPCallout.class"; exit 1; }
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q "Main-Class: io.github.opengw.dbmcp.server.SidecarServer" \
            || { echo "MANIFEST missing Main-Class SidecarServer"; exit 1; }
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-db-mcp-jar-main
          path: target/gateway-db-mcp-*.jar
